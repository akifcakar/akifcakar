<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pilatify - App Prototype</title>
    
    <!-- Meta tags for "Add to Home Screen" on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pilatify">
    
    <link rel="apple-touch-icon" href="https://placehold.co/180x180/f472b6/FFFFFF?text=P&font=roboto">
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Confetti Animation Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen p-8">

    <!-- iPhone Frame -->
    <div class="iphone-frame">
        <!-- Dynamic Island -->
        <div class="dynamic-island"></div>

        <!-- Volume Buttons -->
        <div class="volume-buttons">
            <div class="volume-button"></div>
            <div class="volume-button"></div>
        </div>

        <!-- Power Button -->
        <div class="power-button"></div>

        <!-- Mobile Shell (App Screen) -->
        <div class="mobile-shell relative flex flex-col bg-white">

        <!-- iOS Status Bar -->
        <div class="status-bar">
            <div class="status-bar-left">
                <span id="status-time">9:41</span>
            </div>
            <div class="status-bar-right">
                <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
                    <path d="M1 6C1 3.79086 2.79086 2 5 2H12C14.2091 2 16 3.79086 16 6V6C16 8.20914 14.2091 10 12 10H5C2.79086 10 1 8.20914 1 6V6Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <rect x="2" y="3.5" width="11" height="5" rx="1" fill="currentColor"/>
                </svg>
                <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
                    <rect x="0.5" y="0.5" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1"/>
                    <path d="M16 3.5H17C17.2761 3.5 17.5 3.72386 17.5 4V8C17.5 8.27614 17.2761 8.5 17 8.5H16" fill="currentColor"/>
                    <rect x="2" y="2.5" width="12" height="7" rx="1" fill="currentColor"/>
                </svg>
            </div>
        </div>

        <!-- Splash Screen (Welcome Screen) -->
        <div id="splash-screen" class="absolute inset-0 bg-gradient-to-br from-rose-400 to-orange-300 flex flex-col items-center justify-center z-50 transition-opacity duration-700 ease-out">
            <svg class="w-24 h-24 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h1 class="text-5xl font-extrabold text-white mt-4 tracking-tight">Pilatify</h1>
            <p class="text-white/80 mt-2">Your Path to a Stronger Core</p>
        </div>

        <!-- Achievement Unlocked Modal -->
        <div id="achievement-modal-container" class="hidden"></div>

        <!-- Main App Content -->
        <main id="main-content" class="flex-grow overflow-y-auto custom-scrollbar-none pb-24">
            <!-- This container will hold the different pages -->
        </main>
        
        <!-- Toast Notification Container -->
        <div id="toast-container" class="fixed bottom-20 left-0 right-0 flex justify-center pointer-events-none z-50"></div>

        <!-- Dynamic Header (for Back Button) -->
        <header id="app-header" class="absolute top-0 left-0 right-0 p-3 z-10 hidden">
             <button id="back-button" aria-label="Go back" class="hidden text-gray-700 bg-white/70 backdrop-blur-lg p-2 rounded-full shadow-md hover:bg-gray-100 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
             </button>
        </header>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 bg-white/70 backdrop-blur-lg border-t border-gray-200/80 flex justify-around p-2 z-20 hidden">
            <button data-page="home" class="nav-button flex flex-col items-center text-gray-500 w-1/4 py-1 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="text-xs mt-1">Home</span>
            </button>
            <button data-page="exercises" class="nav-button flex flex-col items-center text-gray-500 w-1/4 py-1 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                <span class="text-xs mt-1">Exercises</span>
            </button>
            <button data-page="program" class="nav-button flex flex-col items-center text-gray-500 w-1/4 py-1 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                <span class="text-xs mt-1">My Program</span>
            </button>
            <button data-page="profile" class="nav-button flex flex-col items-center text-gray-500 w-1/4 py-1 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="text-xs mt-1">Profile</span>
            </button>
        </nav>

        </div>
        <!-- End of mobile-shell -->
    </div>
    <!-- End of iphone-frame -->

    <script>
        // Update status bar time
        function updateStatusBarTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('status-time').textContent = `${hours}:${minutes}`;
        }
        updateStatusBarTime();
        setInterval(updateStatusBarTime, 60000);
    </script>
    <script src="main.js" type="module"></script>
</body>
</html>
